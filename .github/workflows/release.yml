name: Build and Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------
  # 1) Build static Qt + cache it
  # ----------------------------
  qt:
    name: Qt static • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Detect core count and set parallel build level
      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$Env:NUMBER_OF_PROCESSORS" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute Qt commit for cache key (from tree)
        id: qthash
        shell: bash
        run: |
          QTREF=$(git ls-tree HEAD vendor/qt | awk '{print $3}' | cut -c1-7)
          echo "qtref=$QTREF" >> "$GITHUB_OUTPUT"

      - name: Restore cached static Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: superbuild/build/_qt
          key: qt6-static-${{ runner.os }}-${{ steps.qthash.outputs.qtref }}-v1
          restore-keys: |
            qt6-static-${{ runner.os }}-

      # Only fetch & build if cache MISS
      - name: Install build tools / system deps (Linux)
        if: runner.os == 'Linux' && steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config build-essential perl \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcb1-dev libxcb-util-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libxcb-cursor-dev libxcb-xinput-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS' && steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install ninja perl

      - name: Install build tools (Windows)
        if: runner.os == 'Windows' && steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install ninja -y
          choco install strawberryperl -y

      - name: Set up MSVC dev prompt (Windows)
        if: runner.os == 'Windows' && steps.cache-qt.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Ensure qtbase sources present"
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive vendor/qt
          if [ ! -f vendor/qt/qtbase/CMakeLists.txt ] && [ -f vendor/qt/init-repository ]; then
            (cd vendor/qt && perl init-repository --module-subset=qtbase) || true
          fi
          test -f vendor/qt/qtbase/CMakeLists.txt

      - name: Configure superbuild (Qt only) • Linux/macOS
        if: runner.os != 'Windows' && steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake -S superbuild -B superbuild/build-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERBUILD_BUILD_QT:BOOL=ON \
            -DSUPERBUILD_BUILD_OPENCV:BOOL=OFF

      - name: Configure superbuild (Qt only) • Windows
        if: runner.os == 'Windows' && steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: >
          cmake -S superbuild -B superbuild/build-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSUPERBUILD_BUILD_QT:BOOL=ON
          -DSUPERBUILD_BUILD_OPENCV:BOOL=OFF

      - name: Build & install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: cmake --build superbuild/build-qt --target qtbase_static --config Release --parallel

      # Canonicalize the Qt install path for downstream jobs
      - name: Move Qt install to canonical path • Linux/macOS
        if: runner.os != 'Windows' && steps.cache-qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p superbuild/build
          rm -rf superbuild/build/_qt
          mv superbuild/build-qt/_qt superbuild/build/_qt

      - name: Move Qt install to canonical path • Windows
        if: runner.os == 'Windows' && steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dstRoot = Join-Path $env:GITHUB_WORKSPACE "superbuild/build"
          New-Item -ItemType Directory -Force -Path $dstRoot | Out-Null
          $dst = Join-Path $dstRoot "_qt"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          $src = Join-Path $env:GITHUB_WORKSPACE "superbuild/build-qt/_qt"
          Move-Item $src $dst

      - name: Validate Qt prefix (cached or built) • Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = "$env:GITHUB_WORKSPACE\superbuild\build\_qt\lib\cmake\Qt6\Qt6Config.cmake"
          if (Test-Path $cfg) {
            Write-Host "Qt prefix OK: $cfg"
          } else {
            Write-Host "Qt6Config.cmake not found. Tree:"
            Get-ChildItem -Recurse -Depth 3 "$env:GITHUB_WORKSPACE\superbuild\build\_qt" |
              Select-Object -ExpandProperty FullName | Select-Object -First 150 | ForEach-Object { Write-Host $_ }
            throw "Qt6Config.cmake not found."
          }

      - name: Validate Qt prefix (cached or built) • Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          test -f superbuild/build/_qt/lib/cmake/Qt6/Qt6Config.cmake
          echo "Qt prefix is ready."

  # ----------------------------
  # 2) Build static OpenCV + cache it (direct build on cache miss)
  # ----------------------------
  opencv:
    name: OpenCV static • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Detect core count and set parallel build level
      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$Env:NUMBER_OF_PROCESSORS" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute OpenCV commit for cache key (from tree)
        id: ocvhash
        shell: bash
        run: |
          OCVREF=$(git ls-tree HEAD vendor/opencv | awk '{print $3}' | cut -c1-7)
          echo "ocvref=$OCVREF" >> "$GITHUB_OUTPUT"

      - name: Restore cached static OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: superbuild/build/_opencv
          key: opencv-static-${{ runner.os }}-${{ steps.ocvhash.outputs.ocvref }}-v1
          restore-keys: |
            opencv-static-${{ runner.os }}-

      # Only fetch & build if cache MISS
      - name: Install build tools / system deps (Linux)
        if: runner.os == 'Linux' && steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config build-essential libeigen3-dev libtbb-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS' && steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install ninja tbb eigen

      - name: Install build tools (Windows)
        if: runner.os == 'Windows' && steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install ninja -y

      - name: Set up MSVC dev prompt (Windows)
        if: runner.os == 'Windows' && steps.cache-opencv.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Init submodule: vendor/opencv (shallow)"
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init --depth 1 vendor/opencv

      # Quick presence check of canonical locations (avoid deep scans)
      - name: Detect missing OpenCV package • Windows
        if: runner.os == 'Windows'
        id: ocvneed
        shell: pwsh
        run: |
          $p = "$env:GITHUB_WORKSPACE\superbuild\build\_opencv"
          $ok = (Test-Path (Join-Path $p "lib\cmake\opencv4\OpenCVConfig.cmake")) -or
                (Test-Path (Join-Path $p "share\opencv4\OpenCVConfig.cmake"))
          if ($ok) { 'needs=no' | Out-File -Append $env:GITHUB_OUTPUT } else { 'needs=yes' | Out-File -Append $env:GITHUB_OUTPUT }

      # Configure & build OpenCV directly into _opencv
      - name: Configure OpenCV (Linux)
        if: runner.os == 'Linux' && steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/opencv -B superbuild/ocv-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/superbuild/build/_opencv" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_opencv_world=ON \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_python=OFF -DBUILD_opencv_apps=OFF \
            -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_IPP_A=OFF \
            -DWITH_TBB=ON -DWITH_OPENCL=ON -DWITH_EIGEN=ON \
            -DENABLE_FAST_MATH=ON -DWITH_OPENMP=ON

      - name: Configure OpenCV (macOS arm64)
        if: runner.os == 'macOS' && steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/opencv -B superbuild/ocv-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/superbuild/build/_opencv" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_opencv_world=ON \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_python=OFF -DBUILD_opencv_apps=OFF \
            -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_IPP_A=OFF \
            -DWITH_TBB=ON -DWITH_OPENCL=ON -DWITH_EIGEN=ON \
            -DENABLE_FAST_MATH=ON -DWITH_OPENMP=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DENABLE_SSE=OFF -DENABLE_AVX=OFF -DCPU_BASELINE= -DCPU_DISPATCH= -DENABLE_NEON=ON

      - name: Configure OpenCV (Windows)
        if: runner.os == 'Windows' && steps.ocvneed.outputs.needs == 'yes'
        shell: pwsh
        run: >
          cmake -S vendor/opencv -B superbuild/ocv-src -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/superbuild/build/_opencv"
          -DCMAKE_INSTALL_LIBDIR=lib
          -DBUILD_SHARED_LIBS=OFF -DBUILD_opencv_world=ON
          -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF
          -DBUILD_opencv_python=OFF -DBUILD_opencv_apps=OFF
          -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_IPP_A=OFF
          -DWITH_TBB=ON -DWITH_OPENCL=ON -DWITH_EIGEN=ON
          -DENABLE_FAST_MATH=ON -DWITH_OPENMP=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build OpenCV
        if: (runner.os == 'Windows' && steps.ocvneed.outputs.needs == 'yes') || (runner.os != 'Windows' && steps.cache-opencv.outputs.cache-hit != 'true')
        run: cmake --build superbuild/ocv-src --config Release --parallel

      - name: Install OpenCV
        if: (runner.os == 'Windows' && steps.ocvneed.outputs.needs == 'yes') || (runner.os != 'Windows' && steps.cache-opencv.outputs.cache-hit != 'true')
        run: cmake --build superbuild/ocv-src --target install --config Release --parallel

      - name: Validate OpenCV prefix (cached or built) • Windows
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: pwsh
        run: |
          $cfg = "$env:GITHUB_WORKSPACE\superbuild\build\_opencv\lib\cmake\opencv4\OpenCVConfig.cmake"
          if (Test-Path $cfg) {
            Write-Host "OpenCV prefix OK: $cfg"
          } else {
            $alt = "$env:GITHUB_WORKSPACE\superbuild\build\_opencv\share\opencv4\OpenCVConfig.cmake"
            if (Test-Path $alt) {
              Write-Host "OpenCV prefix OK (share path): $alt"
            } else {
              throw "OpenCVConfig.cmake not found in canonical locations."
            }
          }

      - name: Validate OpenCV prefix (cached or built) • Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          if [ -f superbuild/build/_opencv/lib/cmake/opencv4/OpenCVConfig.cmake ]; then
            echo "OpenCV prefix OK: lib/cmake/opencv4"
          elif [ -f superbuild/build/_opencv/share/opencv4/OpenCVConfig.cmake ]; then
            echo "OpenCV prefix OK: share/opencv4"
          else
            echo "OpenCVConfig.cmake not found. Tree:"; find superbuild/build/_opencv -maxdepth 4 -print
            exit 1
          fi

  # ----------------------------------------
  # 3) Build the app using the cached deps
  # ----------------------------------------
  app:
    name: App • ${{ matrix.os }}
    needs: [qt, opencv]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Detect core count and set parallel build level
      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"

      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: Set CMAKE_BUILD_PARALLEL_LEVEL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$Env:NUMBER_OF_PROCESSORS" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Restore both caches for consumption in this job
      - name: Compute Qt commit (from tree)
        id: qthash
        shell: bash
        run: |
          QTREF=$(git ls-tree HEAD vendor/qt | awk '{print $3}' | cut -c1-7)
          echo "qtref=$QTREF" >> "$GITHUB_OUTPUT"

      - name: Compute OpenCV commit (from tree)
        id: ocvhash
        shell: bash
        run: |
          OCVREF=$(git ls-tree HEAD vendor/opencv | awk '{print $3}' | cut -c1-7)
          echo "ocvref=$OCVREF" >> "$GITHUB_OUTPUT"

      - name: Restore cached static Qt
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: superbuild/build/_qt
          key: qt6-static-${{ runner.os }}-${{ steps.qthash.outputs.qtref }}-v1
          restore-keys: |
            qt6-static-${{ runner.os }}-

      - name: Restore cached static OpenCV
        id: cache-opencv
        uses: actions/cache/restore@v4
        with:
          path: superbuild/build/_opencv
          key: opencv-static-${{ runner.os }}-${{ steps.ocvhash.outputs.ocvref }}-v1
          restore-keys: |
            opencv-static-${{ runner.os }}-

      # libuiohook submodule: use OS-appropriate shells
      - name: "Init submodule: vendor/libuiohook (non-Windows)"
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f .gitmodules ] && grep -q "vendor/libuiohook" .gitmodules; then
            git submodule update --init --depth 1 vendor/libuiohook
          fi

      - name: "Init submodule: vendor/libuiohook (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path ".gitmodules") {
            $content = Get-Content ".gitmodules" -Raw
            if ($content -match "vendor/libuiohook") {
              git submodule update --init --depth 1 vendor/libuiohook
            }
          }

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config build-essential \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcb1-dev libxcb-util-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libxcb-cursor-dev libxcb-xinput-dev \
            libxtst-dev libxkbfile-dev libxt-dev \
            libeigen3-dev libtbb-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja tbb eigen

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Set up MSVC dev prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- Configure & build the app ----
      - name: Configure app (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/superbuild/build/_qt;${GITHUB_WORKSPACE}/superbuild/build/_opencv;/opt/homebrew" \
            -DQt6_DIR="${GITHUB_WORKSPACE}/superbuild/build/_qt/lib/cmake/Qt6" \
            -DOpenCV_DIR="${GITHUB_WORKSPACE}/superbuild/build/_opencv/lib/cmake/opencv4"

      - name: Configure app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -G "Ninja Multi-Config"
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\superbuild\build\_qt;$env:GITHUB_WORKSPACE\superbuild\build\_opencv"
          -DQt6_DIR="$env:GITHUB_WORKSPACE\superbuild\build\_qt\lib\cmake\Qt6"
          -DOpenCV_DIR="$env:GITHUB_WORKSPACE\superbuild\build\_opencv\lib\cmake\opencv4"
          -DCMAKE_CXX_FLAGS="/U_HAS_STD_BYTE /D_HAS_STD_BYTE=1"

      - name: Build app (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # -------- package per OS --------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -f "build/BloonsFarm" ]; then
            BIN="build/BloonsFarm"
          else
            BIN="$(find build -maxdepth 3 -type f -name 'BloonsFarm*' | head -n 1 || true)"
          fi
          if [ -z "${BIN:-}" ] || [ ! -f "$BIN" ]; then
            echo "Could not locate built binary. Contents of build/:"; ls -lah build || true; exit 1
          fi
          echo "Packaging $BIN"
          tar -C "$(dirname "$BIN")" -czf "out/BloonsFarm-linux-x86_64.tar.gz" "$(basename "$BIN")"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d "build/BloonsFarm.app" ]; then
            /usr/bin/zip -r "out/BloonsFarm-macOS.zip" "build/BloonsFarm.app"
          else
            BIN="$(find build -maxdepth 3 -type f -name 'BloonsFarm*' | head -n 1 || true)"
            if [ -z "${BIN:-}" ] || [ ! -f "$BIN" ]; then
              echo "Could not locate app bundle or binary. Contents of build/:"; ls -lah build || true; exit 1
            fi
            echo "Packaging $BIN"
            tar -C "$(dirname "$BIN")" -czf "out/BloonsFarm-macOS.tar.gz" "$(basename "$BIN")"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $APP = "BloonsFarm"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (Test-Path "build\Release\$APP.exe") {
            Compress-Archive -Path "build\Release\$APP.exe" -DestinationPath "out\$APP-windows-x64.zip" -Force
          } elseif (Test-Path "build\$APP.exe") {
            Compress-Archive -Path "build\$APP.exe" -DestinationPath "out\$APP-windows-x64.zip" -Force
          } else {
            Get-ChildItem -Recurse build | Write-Output
            throw "Could not locate $APP.exe"
          }

      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-binaries
          path: out/*

      - name: Publish to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
