name: Build & Release (Static Qt)

on:
  push:
    tags: [ "v*" ]     # create a tag like v1.0.0 to publish a release
  workflow_dispatch:    # manual run (uploads as build artifacts, not a release)

permissions:
  contents: write       # needed for publishing release assets

jobs:
  # ----------------------------
  # 1) Build static Qt + cache it
  # ----------------------------
  qt:
    name: Qt static • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools / system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config build-essential perl \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcb1-dev libxcb-util-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libxcb-cursor-dev libxcb-xinput-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          # Perl only needed if using qt super-repo initializer
          choco install strawberryperl -y

      - name: Set up MSVC dev prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Initialize Qt modules (only if using qt super-repo)
        shell: bash
        run: |
          if [ ! -d "vendor/qt/qtbase" ]; then
            (cd vendor/qt && perl init-repository --module-subset=qtbase)
          fi

      - name: Compute Qt commit for cache key
        id: qthash
        shell: bash
        run: |
          if [ -d vendor/qt/.git ]; then
            QTREF=$(git -C vendor/qt rev-parse --short HEAD)
          else
            QTREF=$(git rev-parse --short HEAD)
          fi
          echo "qtref=$QTREF" >> "$GITHUB_OUTPUT"

      - name: Restore cached static Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: superbuild/build/_qt
          key: qt6-static-${{ runner.os }}-${{ steps.qthash.outputs.qtref }}-v1
          restore-keys: |
            qt6-static-${{ runner.os }}-

      - name: Configure superbuild (Ninja)
        run: cmake -S superbuild -B superbuild/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Skip Qt rebuild if prefix already present (cache hit)
      - name: Build & install Qt (Linux/macOS) — only if not already installed
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f superbuild/build/_qt/lib/cmake/Qt6/Qt6Config.cmake ]; then
            echo "Qt prefix already present — skipping Qt build."
          else
            cmake --build superbuild/build --target qtbase_static --config Release -j 4
          fi

      - name: Build & install Qt (Windows) — only if not already installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "superbuild/build/_qt/lib/cmake/Qt6/Qt6Config.cmake") {
            Write-Host "Qt prefix already present — skipping Qt build."
          } else {
            cmake --build superbuild/build --target qtbase_static --config Release -j 4
          }

      - name: Validate cached Qt prefix
        run: |
          test -f superbuild/build/_qt/lib/cmake/Qt6/Qt6Config.cmake
          echo "Cached Qt prefix is ready."

  # ----------------------------------------
  # 2) Build the app using the cached static Qt
  # ----------------------------------------
  app:
    name: App • ${{ matrix.os }}
    needs: qt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config build-essential \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcb1-dev libxcb-util-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libxcb-cursor-dev libxcb-xinput-dev \
            libxtst-dev libxkbfile-dev libxt-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja llvm libomp
          # easiest way to avoid OpenCV's numpy check failing
          python3 -m pip install --user numpy

      - name: Use Homebrew LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CC=/opt/homebrew/opt/llvm/bin/clang" >> $GITHUB_ENV
          echo "CXX=/opt/homebrew/opt/llvm/bin/clang++" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Set up MSVC dev prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # compute qtref BEFORE restoring cache
      - name: Compute Qt commit
        id: qthash
        shell: bash
        run: |
          if [ -d vendor/qt/.git ]; then
            QTREF=$(git -C vendor/qt rev-parse --short HEAD)
          else
            QTREF=$(git rev-parse --short HEAD)
          fi
          echo "qtref=$QTREF" >> "$GITHUB_OUTPUT"

      - name: Restore cached static Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: superbuild/build/_qt
          key: qt6-static-${{ runner.os }}-${{ steps.qthash.outputs.qtref }}-v1
          restore-keys: |
            qt6-static-${{ runner.os }}-

      # ---------- Configure app ----------
      - name: Configure (app-only) with cached Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/superbuild/build/_qt" \
            -DBUILD_opencv_python=OFF -DBUILD_opencv_python3=OFF -DBUILD_JAVA=OFF \
            -DCPU_BASELINE="" -DCPU_DISPATCH=""

      - name: Configure (app-only) with cached Qt (macOS/arm64)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/superbuild/build/_qt" \
            -DBUILD_opencv_python=OFF -DBUILD_opencv_python3=OFF -DBUILD_JAVA=OFF \
            -DCPU_BASELINE=NEON -DCPU_DISPATCH=""

      - name: Configure (app-only, Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\superbuild\build\_qt" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_CXX_FLAGS="/Zc:__cplusplus /permissive- /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN"

      # ---------- Build ----------
      - name: Build app (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build -j 4

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release -j 4

      # ---------- Package ----------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          BIN="$(find build -maxdepth 1 -type f -perm -111 -name 'BloonsFarm*' | head -n1)"
          echo "Found binary: $BIN"
          test -n "$BIN"
          cp "$BIN" out/
          tar -C out -czf out/BloonsFarm-linux-x86_64.tar.gz "$(basename "$BIN")"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          APP=BloonsFarm++
          if [ -d "build/${APP}.app" ]; then
            /usr/bin/zip -r out/${APP}-macOS.zip "build/${APP}.app"
          else
            BIN="$(find build -maxdepth 1 -type f -perm -111 -name 'BloonsFarm*' | head -n1)"
            echo "Found binary: $BIN"
            test -n "$BIN"
            cp "$BIN" out/
            tar -C out -czf out/${APP}-macOS.tar.gz "$(basename "$BIN")"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $APP = "BloonsFarm++"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (Test-Path "build\Release\$APP.exe") {
            Compress-Archive -Path "build\Release\$APP.exe" -DestinationPath "out\$APP-windows-x64.zip" -Force
          } elseif (Test-Path "build\$APP.exe") {
            Compress-Archive -Path "build\$APP.exe" -DestinationPath "out\$APP-windows-x64.zip" -Force
          } else {
            Write-Error "Could not locate $APP.exe in build tree."
            exit 1
          }

      # Upload as build artifacts on manual runs
      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-binaries
          path: out/*

      # Upload to GitHub Release on tags
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
